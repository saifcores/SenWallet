spring:
  application:
    name: ledger
  threads:
    virtual:
      enabled: true
  # The service connects as the application role; Flyway runs as the owner
  # role (ADR-20).
  datasource:
    url: jdbc:postgresql://${LEDGER_DB_HOST:localhost}:${LEDGER_DB_PORT:5432}/ledger
    username: ${LEDGER_DB_USER:ledger_app}
    password: ${LEDGER_DB_PASSWORD:ledger_app}
    hikari:
      maximum-pool-size: ${LEDGER_DB_POOL_SIZE:20}
  flyway:
    user: ${LEDGER_OWNER_USER:ledger_owner}
    password: ${LEDGER_OWNER_PASSWORD:ledger_owner}
    placeholders:
      app_role: ${spring.datasource.username}
  jackson:
    property-naming-strategy: SNAKE_CASE
  security:
    oauth2:
      resourceserver:
        jwt:
          # iss claim (public URL). jwk-set-uri may point at the Docker
          # service name so containers do not need to reach localhost.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/senwallet}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/senwallet/protocol/openid-connect/certs}
          audiences:
            - ledger
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:senwallet}
    password: ${RABBITMQ_PASSWORD:senwallet}
    publisher-confirm-type: correlated

server:
  port: 8002

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

ledger:
  partitions:
    months-ahead: 3
  outbox:
    relay-enabled: true
    delay: 1000
    batch-size: 100
