spring:
  application:
    name: wallet
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${WALLET_DB_HOST:localhost}:${WALLET_DB_PORT:5432}/wallet
    username: ${WALLET_DB_USER:wallet_app}
    password: ${WALLET_DB_PASSWORD:wallet_app}
    hikari:
      maximum-pool-size: ${WALLET_DB_POOL_SIZE:10}
  flyway:
    locations: classpath:db/wallet
    user: ${WALLET_OWNER_USER:wallet_owner}
    password: ${WALLET_OWNER_PASSWORD:wallet_owner}
    placeholders:
      app_role: ${spring.datasource.username}
  jackson:
    property-naming-strategy: SNAKE_CASE
  security:
    oauth2:
      resourceserver:
        jwt:
          # iss claim (public URL). jwk-set-uri may point at the Docker
          # service name so containers do not need to reach localhost.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/senwallet}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/senwallet/protocol/openid-connect/certs}
          audiences:
            - wallet
      client:
        registration:
          wallet-service:
            provider: keycloak
            client-id: wallet-service
            client-secret: ${WALLET_SERVICE_CLIENT_SECRET:wallet-service-secret}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/senwallet/protocol/openid-connect/token}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:senwallet}
    password: ${RABBITMQ_PASSWORD:senwallet}

server:
  port: 8001

wallet:
  ledger:
    base-url: ${LEDGER_BASE_URL:http://localhost:8002}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
