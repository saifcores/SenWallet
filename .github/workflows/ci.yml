name: CI

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # `check` includes integrationTest (Testcontainers; Docker is available on ubuntu-latest).
      - name: Build (unit, property, ArchUnit and integration tests)
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: "**/build/reports/jacoco/"

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the service jars
        run: ./gradlew :contexts:ledger:ledger-boot:bootJar :contexts:wallet:wallet-boot:bootJar --console=plain

      - name: Start the stack
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait

      - name: Check service health
        run: |
          curl -fsS http://localhost:8002/actuator/health
          curl -fsS http://localhost:8001/actuator/health

      - name: Show logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
