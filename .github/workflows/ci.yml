name: CI

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build (unit tests, properties, ArchUnit)
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: "**/build/reports/jacoco/"

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start infrastructure
        run: docker compose -f deploy/docker-compose.yml up -d --wait

      - name: Check ledger database
        run: docker exec senwallet-postgres pg_isready -U senwallet -d ledger

      - name: Stop infrastructure
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
