name: senwallet

services:
  postgres:
    image: postgres:16
    container_name: senwallet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-senwallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senwallet}
      POSTGRES_DB: postgres
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:-ledger_owner}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_app}
      WALLET_OWNER_PASSWORD: ${WALLET_OWNER_PASSWORD:-wallet_owner}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-wallet_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-alpine
    container_name: senwallet-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-senwallet}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-senwallet}
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: senwallet-keycloak
    # Pin hostname to the public URL used by host clients (smoke, README).
    # Services fetch JWKS/tokens via the internal Docker DNS name.
    command:
      - start-dev
      - --import-realm
      - --http-enabled=true
      - --hostname-strict=false
      - --hostname=http://localhost:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/senwallet-realm.json:/opt/keycloak/data/import/senwallet-realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/senwallet/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q senwallet <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 40s

  # Build the jar first: ./gradlew :contexts:ledger:ledger-boot:bootJar
  ledger:
    build:
      context: ../contexts/ledger/ledger-boot
    image: senwallet/ledger:local
    container_name: senwallet-ledger
    environment:
      LEDGER_DB_HOST: postgres
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_app}
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:-ledger_owner}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-senwallet}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-senwallet}
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/senwallet
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/senwallet/protocol/openid-connect/certs
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  # Build the jar first: ./gradlew :contexts:wallet:wallet-boot:bootJar
  wallet:
    build:
      context: ../contexts/wallet/wallet-boot
    image: senwallet/wallet:local
    container_name: senwallet-wallet
    environment:
      WALLET_DB_HOST: postgres
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-wallet_app}
      WALLET_OWNER_PASSWORD: ${WALLET_OWNER_PASSWORD:-wallet_owner}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-senwallet}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-senwallet}
      LEDGER_BASE_URL: http://ledger:8002
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/senwallet
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/senwallet/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/senwallet/protocol/openid-connect/token
      WALLET_SERVICE_CLIENT_SECRET: ${WALLET_SERVICE_CLIENT_SECRET:-wallet-service-secret}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ledger:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  gateway:
    image: traefik:v3.3
    container_name: senwallet-gateway
    ports:
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      wallet:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # S3-compatible object store for bank statements and (later) settlement files.
  # Adobe S3Mock keeps local Compose light; swap for MinIO in shared envs.
  minio:
    image: adobe/s3mock:4.9.1
    container_name: senwallet-minio
    environment:
      initialBuckets: statements
    ports:
      - "9000:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  # Build jars first:
  # ./gradlew :simulators:pispi:bootJar :simulators:mno:bootJar :simulators:bank:bootJar
  sim-pispi:
    build:
      context: ../simulators/pispi
    image: senwallet/pispi:local
    container_name: senwallet-sim-pispi
    environment:
      SERVER_PORT: 9101
      SIMULATOR_HMAC_SECRET: ${SIMULATOR_HMAC_SECRET:-sim-hmac-secret}
      CALLBACK_BASE_URL: ${CALLBACK_BASE_URL:-}
      CALLBACK_PATH: /webhooks/pispi
    ports:
      - "9101:9101"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9101/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

  mno-wave:
    build:
      context: ../simulators/mno
    image: senwallet/mno:local
    container_name: senwallet-mno-wave
    environment:
      SERVER_PORT: 9102
      SIMULATOR_PROVIDER: wave
      SIMULATOR_INITIAL_FLOAT: ${MNO_WAVE_FLOAT:-100000000}
      SIMULATOR_HMAC_SECRET: ${SIMULATOR_HMAC_SECRET:-sim-hmac-secret}
      CALLBACK_BASE_URL: ${CALLBACK_BASE_URL:-}
      CALLBACK_PATH: /webhooks/mno
    ports:
      - "9102:9102"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9102/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

  mno-orange:
    build:
      context: ../simulators/mno
    image: senwallet/mno:local
    container_name: senwallet-mno-orange
    environment:
      SERVER_PORT: 9103
      SIMULATOR_PROVIDER: orange
      SIMULATOR_INITIAL_FLOAT: ${MNO_ORANGE_FLOAT:-100000000}
      SIMULATOR_HMAC_SECRET: ${SIMULATOR_HMAC_SECRET:-sim-hmac-secret}
      CALLBACK_BASE_URL: ${CALLBACK_BASE_URL:-}
      CALLBACK_PATH: /webhooks/mno
    ports:
      - "9103:9103"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9103/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s

  bank-a:
    build:
      context: ../simulators/bank
    image: senwallet/bank:local
    container_name: senwallet-bank-a
    environment:
      SERVER_PORT: 9104
      SIMULATOR_BANK_NAME: bank-a
      SIMULATOR_HMAC_SECRET: ${SIMULATOR_HMAC_SECRET:-sim-hmac-secret}
      # S3Mock listens on 9090 inside the network; host maps 9000→9090.
      MINIO_ENDPOINT: http://minio:9090
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: statements
    ports:
      - "9104:9104"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9104/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s

  bank-b:
    build:
      context: ../simulators/bank
    image: senwallet/bank:local
    container_name: senwallet-bank-b
    environment:
      SERVER_PORT: 9105
      SIMULATOR_BANK_NAME: bank-b
      SIMULATOR_HMAC_SECRET: ${SIMULATOR_HMAC_SECRET:-sim-hmac-secret}
      # S3Mock listens on 9090 inside the network; host maps 9000→9090.
      MINIO_ENDPOINT: http://minio:9090
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: statements
    ports:
      - "9105:9105"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9105/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s

volumes:
  postgres-data:
