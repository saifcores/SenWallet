name: senwallet

services:
  postgres:
    image: postgres:16
    container_name: senwallet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-senwallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senwallet}
      POSTGRES_DB: postgres
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
