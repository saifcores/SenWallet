name: senwallet

services:
  postgres:
    image: postgres:16
    container_name: senwallet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-senwallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senwallet}
      POSTGRES_DB: postgres
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:-ledger_owner}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_app}
      WALLET_OWNER_PASSWORD: ${WALLET_OWNER_PASSWORD:-wallet_owner}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-wallet_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Build the jar first: ./gradlew :contexts:ledger:ledger-boot:bootJar
  ledger:
    build:
      context: ../contexts/ledger/ledger-boot
    image: senwallet/ledger:local
    container_name: senwallet-ledger
    environment:
      LEDGER_DB_HOST: postgres
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_app}
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:-ledger_owner}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-senwallet}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-senwallet}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  # Build the jar first: ./gradlew :contexts:wallet:wallet-boot:bootJar
  wallet:
    build:
      context: ../contexts/wallet/wallet-boot
    image: senwallet/wallet:local
    container_name: senwallet-wallet
    environment:
      WALLET_DB_HOST: postgres
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-wallet_app}
      WALLET_OWNER_PASSWORD: ${WALLET_OWNER_PASSWORD:-wallet_owner}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-senwallet}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-senwallet}
      LEDGER_BASE_URL: http://ledger:8002
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  rabbitmq:
    image: rabbitmq:4-alpine
    container_name: senwallet-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-senwallet}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-senwallet}
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
