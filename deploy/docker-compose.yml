name: senwallet

services:
  postgres:
    image: postgres:16
    container_name: senwallet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-senwallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senwallet}
      POSTGRES_DB: postgres
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:-ledger_owner}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Build the jar first: ./gradlew :contexts:ledger:ledger-boot:bootJar
  ledger:
    build:
      context: ../contexts/ledger/ledger-boot
    image: senwallet/ledger:local
    container_name: senwallet-ledger
    environment:
      LEDGER_DB_HOST: postgres
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_app}
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:-ledger_owner}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

volumes:
  postgres-data:
