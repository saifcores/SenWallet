spring:
  application:
    name: sim-mno
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:9102}

simulator:
  provider: ${SIMULATOR_PROVIDER:wave}
  hmac-secret: ${SIMULATOR_HMAC_SECRET:sim-hmac-secret}
  callback-base-url: ${CALLBACK_BASE_URL:}
  callback-path: ${CALLBACK_PATH:/webhooks/mno}
  initial-float: ${SIMULATOR_INITIAL_FLOAT:100000000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
