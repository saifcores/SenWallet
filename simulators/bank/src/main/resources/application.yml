spring:
  application:
    name: sim-bank
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:9104}

simulator:
  bank-name: ${SIMULATOR_BANK_NAME:bank-a}
  hmac-secret: ${SIMULATOR_HMAC_SECRET:sim-hmac-secret}
  callback-base-url: ${CALLBACK_BASE_URL:}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:statements}
    region: ${MINIO_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
