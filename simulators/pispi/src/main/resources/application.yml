spring:
  application:
    name: sim-pispi
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:9101}

simulator:
  hmac-secret: ${SIMULATOR_HMAC_SECRET:sim-hmac-secret}
  callback-base-url: ${CALLBACK_BASE_URL:}
  callback-path: ${CALLBACK_PATH:/webhooks/pispi}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
